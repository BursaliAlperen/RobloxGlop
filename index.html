<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxGlop | Fast & Secure Script Access</title>

    <!-- Google AdSense Main Library -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7036109597530319" crossorigin="anonymous"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fcfdfe;
            color: #1a202c;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.02);
            border-radius: 1.5rem;
        }

        .btn-primary {
            background: #111827;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-primary:hover:not(:disabled) {
            background: #374151;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.2);
        }

        .accent-blue {
            color: #3b82f6;
        }

        .ad-container {
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 1rem;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #e2e8f0;
            position: relative;
        }

        /* Prevent script text from leaking */
        .ad-container script { display: none !important; }

        .ad-tag {
            font-size: 9px;
            text-transform: uppercase;
            color: #cbd5e1;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            pointer-events: none;
        }

        #adGate {
            display: none;
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9000;
            overflow-y: auto;
        }

        .admin-panel {
            background: #ffffff;
            border-bottom: 1px solid #edf2f7;
            position: relative;
            z-index: 100;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #111827;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 100000;
            display: none;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="antialiased">

    <!-- Admin Panel -->
    <div class="admin-panel px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-wrap gap-4 items-center">
            <div class="flex-1 flex gap-3 min-w-[300px]">
                <input id="admName" type="text" placeholder="Script Name" class="w-1/4 border border-gray-200 px-4 py-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500/20">
                <input id="admDesc" type="text" placeholder="Description" class="w-1/4 border border-gray-200 px-4 py-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500/20">
                <input id="admUrl" type="text" placeholder="Pastebin/URL" class="flex-1 border border-gray-200 px-4 py-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500/20">
            </div>
            <button onclick="createScriptLink()" class="btn-primary px-6 py-2 text-xs uppercase tracking-wider">Generate Link</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-gray-100 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <i class="fas fa-bolt"></i>
                </div>
                <span class="text-2xl font-black tracking-tight">Roblox<span class="accent-blue">Glop</span></span>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="pt-16 pb-12 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-5xl md:text-7xl font-extrabold text-gray-900 leading-tight mb-6 tracking-tight">
            Premium scripts, <br><span class="accent-blue">zero keys.</span>
        </h1>
        
        <!-- REKLAM 1 -->
        <div class="ad-container">
            <span class="ad-tag">Advertisement</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7036109597530319"
                 data-ad-slot="6017950337"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <p class="text-gray-500 text-lg mb-10 font-medium">
            Access the latest Roblox exploits instantly.
        </p>
    </header>

    <!-- Script Grid -->
    <main class="max-w-7xl mx-auto px-6 pb-32">
        <div id="scriptContainer" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- AD GATE -->
    <div id="adGate" class="fade-in">
        <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-[100]">
            <div class="flex items-center gap-4">
                <div class="bg-gray-100 text-gray-900 text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-tighter">
                    STEP <span id="gateStep">1</span> / 5
                </div>
                <h3 id="gateTitle" class="font-bold text-gray-800 text-sm truncate max-w-[200px]">Verification</h3>
            </div>
            <div class="flex items-center gap-5">
                <div id="scrollHint" class="text-[11px] font-black text-blue-600 animate-bounce">↓ SCROLL TO CONTINUE</div>
                <div id="countdown" class="hidden font-black text-2xl text-blue-600">15s</div>
                <button id="gateContinue" disabled class="btn-primary px-8 py-2.5 text-xs opacity-30 cursor-not-allowed">NEXT</button>
            </div>
        </div>

        <div id="gateBody" class="max-w-3xl mx-auto py-10 px-6">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Final Step -->
    <div id="successOverlay" class="fixed inset-0 bg-white z-[10000] hidden flex flex-col items-center justify-start p-6 text-center overflow-y-auto">
        <div class="max-w-md w-full glass-card p-10 border-2 border-blue-50 mt-10">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="text-3xl font-black mb-4">Access Granted!</h2>
            <a id="finalAccessLink" href="#" target="_blank" class="block w-full btn-primary py-4 text-lg no-underline shadow-xl mb-4">GET SCRIPT</a>
            <button onclick="location.reload()" class="text-gray-400 text-xs font-bold uppercase tracking-widest hover:text-gray-900">Home</button>
        </div>

        <!-- REKLAM 4 -->
        <div class="ad-container w-full max-w-3xl mt-8">
            <span class="ad-tag">Recommended Content</span>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="autorelaxed"
                 data-ad-client="ca-pub-7036109597530319"
                 data-ad-slot="8023120978"></ins>
        </div>
    </div>

    <div id="toast" class="toast">Action completed!</div>

    <script>
        let scripts = JSON.parse(localStorage.getItem('glop_v3_data')) || [
            { id: 'def1', name: 'Infinite Yield', desc: 'Universal Admin Commands.', url: 'https://pastebin.com/raw/infyield' }
        ];

        let currentStep = 1;
        let timerRunning = false;
        let targetUrl = "";

        const adArticles = [
            { t: "The Future of Cybersecurity", c: "Protecting your digital footprint is paramount. Learn how end-to-end encryption is shaping secure browsing." },
            { t: "Cloud Infrastructure Scaling", c: "Serverless computing allows developers to deploy scripts that scale instantly across global nodes." },
            { t: "AI Integration in Scripting", c: "Artificial intelligence is being used to automate repetitive tasks and optimize real-time code." },
            { t: "Optimizing Roblox Luau", c: "Luau offers performance enhancements that are critical for complex tasks. Proper memory management is key." },
            { t: "Verification Complete", c: "Your session is verified. Click below to retrieve your requested script link securely." }
        ];

        // Safe Ad Refresh Function
        function refreshAds() {
            const ads = document.querySelectorAll('.adsbygoogle:not([data-adsbygoogle-status="done"])');
            ads.forEach(() => {
                try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}
            });
        }

        function createScriptLink() {
            const name = document.getElementById('admName').value;
            const desc = document.getElementById('admDesc').value;
            const url = document.getElementById('admUrl').value;
            if(!name || !url) return triggerToast("Fill name and URL!");
            const id = Math.random().toString(36).substring(2, 8);
            scripts.push({ id, name, desc, url });
            localStorage.setItem('glop_v3_data', JSON.stringify(scripts));
            renderList();
            triggerToast("Link Generated!");
        }

        function renderList() {
            const container = document.getElementById('scriptContainer');
            if(!container) return;
            container.innerHTML = scripts.map(s => `
                <div class="glass-card p-8 group transition-all duration-300">
                    <h3 class="text-xl font-bold mb-2 text-gray-800">${s.name}</h3>
                    <p class="text-gray-400 text-sm mb-8">${s.desc || ''}</p>
                    <div class="flex gap-3">
                        <button onclick="handleScriptClick('${s.id}')" class="flex-1 btn-primary py-3.5 text-xs">UNLOAD SCRIPT</button>
                    </div>
                </div>
            `).join('');
            refreshAds();
        }

        function handleScriptClick(id) {
            const s = scripts.find(x => x.id === id);
            if(s) {
                targetUrl = s.url;
                currentStep = 1;
                document.getElementById('adGate').style.display = 'block';
                document.body.style.overflow = 'hidden';
                loadStep();
            }
        }

        function loadStep() {
            const data = adArticles[currentStep - 1];
            const body = document.getElementById('gateBody');
            const btn = document.getElementById('gateContinue');
            const hint = document.getElementById('scrollHint');
            const timer = document.getElementById('countdown');

            document.getElementById('gateStep').innerText = currentStep;
            document.getElementById('gateTitle').innerText = data.t;

            timerRunning = false;
            btn.disabled = true;
            btn.classList.add('opacity-30');
            hint.style.display = 'block';
            timer.style.display = 'none';

            // TEMİZ HTML: Script etiketlerini JS içinden HTML'e basmıyoruz
            body.innerHTML = `
                <div class="space-y-8 fade-in">
                    <div class="ad-container">
                        <span class="ad-tag">Advertisement</span>
                        <ins class="adsbygoogle"
                             style="display:block; text-align:center;"
                             data-ad-layout="in-article"
                             data-ad-format="fluid"
                             data-ad-client="ca-pub-7036109597530319"
                             data-ad-slot="9219213187"></ins>
                    </div>

                    <h2 class="text-4xl font-black text-gray-900">${data.t}</h2>
                    <p class="text-lg text-gray-500">${data.c}</p>
                    
                    <div class="ad-container">
                        <span class="ad-tag">Sponsored Content</span>
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-format="fluid"
                             data-ad-layout-key="-6t+ed+2i-1n-4w"
                             data-ad-client="ca-pub-7036109597530319"
                             data-ad-slot="7169204305"></ins>
                    </div>
                    <div class="h-60"></div>
                </div>
            `;
            
            refreshAds();
            document.getElementById('adGate').scrollTop = 0;
        }

        document.getElementById('adGate').onscroll = function() {
            if(timerRunning) return;
            const wrap = document.getElementById('adGate');
            if(wrap.scrollHeight - wrap.scrollTop <= wrap.clientHeight + 100) {
                beginStepTimer();
            }
        };

        function beginStepTimer() {
            timerRunning = true;
            const timer = document.getElementById('countdown');
            const hint = document.getElementById('scrollHint');
            const btn = document.getElementById('gateContinue');

            hint.style.display = 'none';
            timer.style.display = 'block';
            
            let seconds = 15;
            timer.innerText = seconds + "s";

            const interval = setInterval(() => {
                seconds--;
                if(timer) timer.innerText = seconds + "s";
                if(seconds <= 0) {
                    clearInterval(interval);
                    if(timer) timer.style.display = 'none';
                    if(btn) {
                        btn.disabled = false;
                        btn.classList.remove('opacity-30');
                    }
                }
            }, 1000);
        }

        document.getElementById('gateContinue').onclick = () => {
            if(currentStep < 5) {
                currentStep++;
                if(Math.random() > 0.7) window.open('https://www.google.com', '_blank');
                loadStep();
            } else {
                document.getElementById('adGate').style.display = 'none';
                document.getElementById('finalAccessLink').href = targetUrl;
                document.getElementById('successOverlay').classList.remove('hidden');
                refreshAds();
            }
        };

        function triggerToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const scriptId = params.get('script');
            renderList();
            if(scriptId) {
                const s = scripts.find(x => x.id === scriptId);
                if(s) handleScriptClick(s.id);
            }
        };
    </script>
</body>
</html>
